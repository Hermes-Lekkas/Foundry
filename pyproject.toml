[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-foundry"
version = "0.1.0"
description = "The Foundry — Local LLM Training Ecosystem"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hermes Lekkas" }]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=12.0,<14.0",
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
training = [
    "torch>=2.4",
    "transformers>=4.45",
    "datasets>=3.0",
    "trl>=0.12",
    "peft>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "unsloth>=2024.10",
    "safetensors>=0.4",
    "pynvml>=11.5",
]
eval = [
    "rouge-score>=0.1",
    "sacrebleu>=2.4",
    "human-eval>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
all = ["the-foundry[training,eval,dev]"]

[project.scripts]
foundry = "foundry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["foundry"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
